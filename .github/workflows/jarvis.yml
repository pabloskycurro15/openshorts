# JARVIS: pruebas en Linux y Windows, e instalador de Windows (NSIS).
name: JARVIS

on:
  push:
    paths: ['jarvis/**', '.github/workflows/jarvis.yml']
    tags: ['jarvis-v*']
  pull_request:
    paths: ['jarvis/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: jarvis

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  installer:
    name: Instalador de Windows
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis/package-lock.json
      - run: npm ci
      - run: npm run dist:win
        env:
          # Sin certificado de firma: Windows mostrará «editor desconocido» (SmartScreen).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup-windows
          path: jarvis/apps/desktop/release/JARVIS-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  mac:
    name: App para Mac (Apple Silicon)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis/package-lock.json
      - run: npm ci
      # Firma ad-hoc (sin cuenta de desarrollador de Apple): la primera vez hay que abrirla con clic derecho → Abrir.
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mac
          path: |
            jarvis/apps/desktop/release/*.dmg
            jarvis/apps/desktop/release/*-mac.zip
            jarvis/apps/desktop/release/*-arm64-mac.zip
          if-no-files-found: error
          retention-days: 30
